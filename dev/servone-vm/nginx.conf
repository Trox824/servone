map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Cloudflare Tunnel terminates TLS and dials this server over plain HTTP.
server {
  listen 80;
  server_name platform.servone.app;
  client_max_body_size 200m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 1h;

  location /_accounts/ { proxy_pass http://account:3000/; }
  location /_transactor/ { proxy_pass http://transactor:3332/; }
  location /_collaborator/ { proxy_pass http://collaborator:3078/; }
  location /_datalake/ { proxy_pass http://datalake:4030/; }
  location /_pulse/ { proxy_pass http://hulypulse:8099/; }
  location / { proxy_pass http://front:8080; }
}

# MCP OAuth metadata must sit at the host root, so the Servone services get their own host.
server {
  listen 80;
  server_name mcp.servone.app;
  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 1h;

  location / { proxy_pass http://servone:4073; }
}
