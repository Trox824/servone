# Docker DNS, re-resolved so recreated containers (new IPs) do not 502 until nginx restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Cloudflare Tunnel terminates TLS and dials this server over plain HTTP.
server {
  listen 80;
  server_name platform.servone.app;
  client_max_body_size 200m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 1h;

  # No trailing slash in the prefix: nginx would 301 a POST to bare /_accounts into a GET.
  location /_accounts { set $up account:3000; rewrite ^/_accounts/?(.*)$ /$1 break; proxy_pass http://$up; }
  location /_transactor { set $up transactor:3332; rewrite ^/_transactor/?(.*)$ /$1 break; proxy_pass http://$up; }
  location /_collaborator { set $up collaborator:3078; rewrite ^/_collaborator/?(.*)$ /$1 break; proxy_pass http://$up; }
  location /_datalake { set $up datalake:4030; rewrite ^/_datalake/?(.*)$ /$1 break; proxy_pass http://$up; }
  location /_pulse { set $up hulypulse:8099; rewrite ^/_pulse/?(.*)$ /$1 break; proxy_pass http://$up; }
  location / { set $up front:8080; proxy_pass http://$up; }
}

# MCP OAuth metadata must sit at the host root, so the Servone services get their own host.
server {
  listen 80;
  server_name mcp.servone.app;
  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 1h;

  location / { set $up servone:4073; proxy_pass http://$up; }
}
