# Servone on the Saola VM (VT-SaolaAgent14), behind a Cloudflare Tunnel.
# Fork images come from .github/workflows/servone-images.yml; deploy.sh pulls them. Nothing is built on the VM.
# Secrets live in .env next to this file on the VM only.
name: servone

x-node: &node
  restart: unless-stopped
  mem_limit: 256m
  networks: [servone]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

# Kafka consumers that start before redpanda is up never retry, so they wait for its healthcheck.
x-consumer: &consumer
  <<: *node
  depends_on:
    redpanda: { condition: service_healthy }
    cockroach: { condition: service_started }

x-urls:
  - &db_url postgresql://root@cockroach:26257/defaultdb?sslmode=disable
  - &storage datalake|http://datalake:4030
  - &queue redpanda:9092
  - &accounts http://account:3000
  - &front_url https://platform.servone.app
  - &files_url https://platform.servone.app/_datalake/blob/:workspace/:blobId/:filename

services:
  cockroach:
    image: cockroachdb/cockroach:v24.3.36
    command: start-single-node --insecure --cache=96MiB --max-sql-memory=128MiB --max-go-memory=384MiB
    volumes: [cockroach:/cockroach/cockroach-data]
    <<: *node
    mem_limit: 768m

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command: >
      redpanda start --mode dev-container --smp 1 --memory 384M --reserve-memory 0M --overprovisioned
      --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
      --rpc-addr redpanda:33145 --advertise-rpc-addr redpanda:33145 --default-log-level=warn
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: [CMD, rpk, cluster, health, --exit-when-healthy]
      interval: 10s
      timeout: 10s
      retries: 30
    <<: *node
    mem_limit: 512m

  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [files:/data]
    <<: *node

  elastic:
    image: elasticsearch:7.14.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    volumes: [elastic:/usr/share/elasticsearch/data]
    <<: *node
    mem_limit: 768m

  redis:
    image: redis:8.0.2-alpine3.21
    <<: *node
    mem_limit: 64m

  account:
    image: ghcr.io/trox824/servone-account:${SERVONE_TAG:-develop}
    environment:
      ACCOUNT_PORT: "3000"
      PRODUCT_NAME: Servone
      SERVER_SECRET: ${SECRET}
      DB_URL: *db_url
      ACCOUNTS_URL: https://platform.servone.app/_accounts
      # internal;external;region
      TRANSACTOR_URL: ws://transactor:3332;wss://platform.servone.app/_transactor;cockroach,
      STORAGE_CONFIG: *storage
      QUEUE_CONFIG: *queue
      REGION_INFO: cockroach|CockroachDB
      FRONT_URL: *front_url
      MAIL_URL: http://mail:8097
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      WORKSPACE_LIMIT_PER_USER: "10000"
      LAST_NAME_FIRST: "true"
      CORS_ORIGINS: *front_url
      BRANDING_PATH: /usr/src/app/branding.json
    <<: *consumer
    mem_limit: 384m

  transactor:
    image: ghcr.io/trox824/servone-transactor:${SERVONE_TAG:-develop}
    environment:
      SERVER_PORT: "3332"
      SERVER_SECRET: ${SECRET}
      DB_URL: *db_url
      ACCOUNTS_URL: *accounts
      STORAGE_CONFIG: *storage
      QUEUE_CONFIG: *queue
      REGION: cockroach
      FRONT_URL: *front_url
      FILES_URL: *files_url
      FULLTEXT_URL: http://fulltext:4702
      MAIL_URL: http://mail:8097
      WEB_PUSH_URL: http://servone:4073
      MAIL_AUTH_TOKEN: ${MAIL_AUTH_TOKEN}
      ENABLE_COMPRESSION: "true"
      COMMUNICATION_API_ENABLED: "true"
      HULYLAKE_URL: http://hulylake:8096
      LAST_NAME_FIRST: "true"
      METRICS_CONSOLE: "false"
    <<: *consumer
    mem_limit: 1g

  workspace:
    image: hardcoreeng/workspace:s0.7.437
    environment:
      WS_OPERATION: all
      REGION: cockroach
      SERVER_SECRET: ${SECRET}
      QUEUE_CONFIG: *queue
      DB_URL: *db_url
      ACCOUNTS_DB_URL: *db_url
      STORAGE_CONFIG: *storage
      ACCOUNTS_URL: *accounts
      MAIL_URL: http://mail:8097
      # Nonexistent on purpose: the stock image ships Huly's demo projects in ./init-scripts.
      INIT_REPO_DIR: /servone-no-init
    <<: *consumer
    mem_limit: 768m

  collaborator:
    image: hardcoreeng/collaborator:s0.7.437
    environment:
      COLLABORATOR_PORT: "3078"
      SECRET: ${SECRET}
      ACCOUNTS_URL: *accounts
      STORAGE_CONFIG: *storage
    <<: *node
    mem_limit: 384m

  datalake:
    image: hardcoreeng/datalake:s0.7.437
    environment:
      PORT: "4030"
      SECRET: ${SECRET}
      ACCOUNTS_URL: *accounts
      DB_URL: *db_url
      BUCKETS: blobs,eu|http://minio:9000?accessKey=${MINIO_USER}&secretKey=${MINIO_PASSWORD}
      QUEUE_CONFIG: *queue
      REGION: cockroach
    <<: *consumer
    mem_limit: 384m

  hulylake:
    image: hardcoreeng/hulylake:s0.7.437
    environment:
      HULY_TOKEN_SECRET: ${SECRET}
      HULY_DB_CONNECTION: *db_url
      HULY_S3_BUCKET: blobs
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: local
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    <<: *node
    mem_limit: 128m

  hulykvs:
    image: hardcoreeng/hulykvs:s0.7.437
    environment:
      HULY_DB_CONNECTION: *db_url
      HULY_TOKEN_SECRET: ${SECRET}
    <<: *node
    mem_limit: 128m

  hulypulse:
    image: hardcoreeng/hulypulse:s0.7.437
    environment:
      HULY_REDIS_URLS: redis://redis:6379
      HULY_BIND_PORT: "8099"
      HULY_TOKEN_SECRET: ${SECRET}
    <<: *node
    mem_limit: 64m

  fulltext:
    image: hardcoreeng/fulltext:s0.7.437
    environment:
      PORT: "4702"
      SERVER_SECRET: ${SECRET}
      DB_URL: *db_url
      REGION: cockroach
      QUEUE_CONFIG: *queue
      ACCOUNTS_URL: *accounts
      STORAGE_CONFIG: *storage
      HULYLAKE_URL: http://hulylake:8096
      COMMUNICATION_API_ENABLED: "true"
      FULLTEXT_DB_URL: http://elastic:9200
      ELASTIC_INDEX_NAME: servone_index
      # Must be defined; blank skips attachment text extraction (no rekoni).
      REKONI_URL: ""
    <<: *consumer
    mem_limit: 512m

  time-machine:
    image: hardcoreeng/worker:s0.7.437
    environment:
      DB_URL: *db_url
      QUEUE_CONFIG: *queue
      QUEUE_REGION: cockroach
    <<: *consumer

  events-processor:
    image: hardcoreeng/events-processor:s0.7.437
    environment:
      SERVICE_ID: events-processor
      SECRET: ${SECRET}
      ACCOUNTS_URL: *accounts
      QUEUE_CONFIG: *queue
      QUEUE_REGION: cockroach
    <<: *consumer

  process:
    image: hardcoreeng/process:s0.7.437
    environment:
      SECRET: ${SECRET}
      ACCOUNTS_URL: *accounts
      COLLABORATOR_URL: http://collaborator:3078
      QUEUE_CONFIG: *queue
      QUEUE_REGION: cockroach
    <<: *consumer

  notification:
    image: hardcoreeng/notification:s0.7.437
    environment:
      PORT: "8091"
      SOURCE: Servone <no-reply@servone.app>
      PUSH_SUBJECT: mailto:no-reply@servone.app
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY}
    <<: *node
    mem_limit: 192m

  mail:
    image: hardcoreeng/mail:s0.7.437
    environment:
      PORT: "8097"
      SOURCE: Servone <no-reply@servone.app>
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "465"
      SMTP_TLS_MODE: secure
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${RESEND_KEY}
    <<: *node
    mem_limit: 192m

  servone:
    image: ghcr.io/trox824/servone-services:${SERVONE_TAG:-develop}
    environment:
      PORT: "4073"
      SECRET: ${SECRET}
      ACCOUNTS_URL: *accounts
      # No calendar service runs here; the starter module only needs a syntactically valid URL.
      CALENDAR_URL: http://calendar:8095
      HULYKVS_URL: http://hulykvs:8094
      COLLABORATOR_URL: http://collaborator:3078
      FRONT_URL: *front_url
      PUBLIC_URL: https://mcp.servone.app
      NOTIFICATION_URL: http://notification:8091
      MAIL_URL: http://mail:8097
      MAIL_AUTH_TOKEN: ${MAIL_AUTH_TOKEN}
      BUG_REPORT_TO: support@servone.app
      RESEND_API_KEY: ${RESEND_KEY}
      QUEUE_CONFIG: *queue
      QUEUE_REGION: cockroach
      STORAGE_CONFIG: *storage
      POSTHOG_KEY: ${POSTHOG_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    <<: *consumer
    mem_limit: 384m

  front:
    image: ghcr.io/trox824/servone-front:${SERVONE_TAG:-develop}
    environment:
      SERVER_PORT: "8080"
      SERVER_SECRET: ${SECRET}
      ACCOUNTS_URL: https://platform.servone.app/_accounts
      ACCOUNTS_URL_INTERNAL: *accounts
      COLLABORATOR_URL: wss://platform.servone.app/_collaborator
      DATALAKE_URL: https://platform.servone.app/_datalake
      FILES_URL: *files_url
      UPLOAD_URL: /files
      STORAGE_CONFIG: *storage
      PULSE_URL: wss://platform.servone.app/_pulse/ws
      BRANDING_URL: /branding.json
      # The front refuses to start without these, though none of those apps run here.
      GMAIL_URL: https://platform.servone.app/_off
      REKONI_URL: https://platform.servone.app/_off
      TELEGRAM_URL: https://platform.servone.app/_off
      CALENDAR_URL: https://platform.servone.app/_off
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY}
      DISABLED_FEATURES: auto-translate,mailboxes
      EXCLUDED_APPLICATIONS_FOR_ANONYMOUS: "[]"
      COMMUNICATION_API_ENABLED: "true"
      LAST_NAME_FIRST: "true"
      VERSION: 0.7.437
      MODEL_VERSION: 0.7.426
    <<: *node

  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    # LAN access for checks before the tunnel is live; 3000/8080/5000 belong to Saola.
    ports: ["127.0.0.1:8090:80"]
    <<: *node
    mem_limit: 64m

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    profiles: [tunnel]
    <<: *node
    mem_limit: 128m

networks:
  servone:

volumes:
  cockroach:
  redpanda:
  files:
  elastic:
