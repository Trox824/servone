protocols = imap
listen = *
log_path = /dev/stdout
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
mail_location = maildir:/srv/vmail/%u
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
passdb {
  driver = static
  args = password=test-pass
}
userdb {
  driver = static
  args = home=/srv/vmail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}
protocol imap {
  mail_max_userip_connections = 50
}
