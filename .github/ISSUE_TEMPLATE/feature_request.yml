name: Feature request
description: Suggest a change or a new feature
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the work you are doing and where Servone gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Servone to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Another tool, a workaround, or nothing.
